<div class="product-item">
  <div class="product-item-list">
    <p>Código</p>
    <input type="text" [(ngModel)]="product.code" placeholder="Código" [disabled]="true">
  </div>

  <div class="product-item-list">
    <p>Nome</p>
    <input type="text" [(ngModel)]="product.name" placeholder="Nome" [disabled]="!isEditing">
  </div>

  <div class="product-item-list">
    <p>Descrição</p>
    <input type="text" [(ngModel)]="product.description" placeholder="Descrição" [disabled]="!isEditing">
  </div>

  <div class="product-item-list">
    <p>Quantidade</p>
    <input type="number" [(ngModel)]="product.amount" placeholder="Quantidade" [disabled]="!isEditing">
  </div>

  <div class="buttons-container">
    <button (click)="onDeleteProduct()">
      <img src="lixeira-de-reciclagem.png" alt="Deletar">
    </button>

    <button *ngIf="!isEditing" (click)="onEditProduct()">
      <img src="editar.png" alt="Editar">
    </button>

    <button *ngIf="isEditing" (click)="onConfirmEditProduct()">
      <img src="salvar.png" alt="Salvar">
    </button>

    <button *ngIf="isEditing" (click)="onCancelEditProduct()">
      <img src="cancelar.png" alt="Cancelar">
    </button>
  </div>
</div>
