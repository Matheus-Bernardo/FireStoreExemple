<div class="container">
    <div class="header">
        <h2>Lista de Produtos</h2>
        <button (click)="addProduct()">Novo produto</button>
    </div>
    <div *ngFor="let product of products; let i = index">
        <app-product-item [product]="product" (delete)="deleteProduct(i)">
        </app-product-item>
    </div>
</div>
